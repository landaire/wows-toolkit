[package]
name = "buck-reindeer-features"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dhat = "0.3"
mimalloc = "0.1"
# wgc-download's unpack tests build a 7z fixture in-process, which needs the
# dev-only "compress" feature.
sevenz-rust2 = { version = "0.21", default-features = false, features = ["compress"] }
tar = "0.4"
# Dev-dependencies of workspace crates. Reindeer generates rules only for
# normal dependencies, so the Buck test targets reach these through here.
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu"] }
filetime = "0.2"
insta = { workspace = true }
rust-crypto = "0.2.36"
rustls-graviola = "0.4"
# landaire-ui's test-support dependencies, which only its dependents'
# dev-dependencies enable.
accesskit_consumer = { workspace = true }
zgui-platform-headless = { workspace = true }
zgui-render-vector-vello = { workspace = true }
zgui-render-wgpu = { workspace = true }
zgui-testkit-scene = { workspace = true }

[lints.cargo]
# Every dependency here exists only for reindeer to resolve it for Buck.
unused_dependencies = "allow"
