[package]
name = "wows-toolkit-config"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { version = "1.51", features = ["rt", "rt-multi-thread", "macros"] }
home = "0.5"
wows-core = { path = "../wows-core", features = ["serde"] }
# Only for `PersonalRatingCategory`: the rating filter is a range over the
# existing `indexed_vehicle.pr`, so it reads the band boundaries from the crate
# that owns them rather than restating them here.
wows-replay-insights = { workspace = true, features = ["personal-rating"] }
thiserror = { workspace = true }
jiff = { workspace = true, features = ["serde"] }
winnow = { workspace = true }

[features]
# Compiles the timezone override in, so another crate's tests can pin the zone a
# bare date and the printer's midnight check resolve against. Off in every
# production build, which is what keeps "the zone" meaning the system's own.
test-support = []

[dev-dependencies]
tokio = { version = "1.51", features = ["rt", "macros"] }
tempfile = "3.27.0"
