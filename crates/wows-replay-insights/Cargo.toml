[package]
name = "wows-replay-insights"
version = "0.11.0"
authors = ["landaire"]
description = "Derived, post-parse projections over a WoWs replay: build resolution, timeline events, etc."
repository = "https://github.com/landaire/wows-toolkit"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wows-core = { workspace = true }
wowsunpack = { workspace = true, default-features = false, features = ["parsing"] }
wows_replays = { workspace = true, default-features = false, features = ["parsing"] }
wows-battle-world = { workspace = true, default-features = false }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
jiff = { workspace = true, features = ["serde"], optional = true }
flate2 = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }

[dev-dependencies]
wows-data-mgr = { workspace = true }
wows_replays = { workspace = true, features = ["vfs", "arc"] }
# `models` carries assets.bin parsing and `fire_nodes::resolve_fire_sections`,
# which the fire-chance corpus test needs to place a hull's fire sections.
wowsunpack = { workspace = true, features = ["arc", "vfs-mmap", "models"] }
serde_json = { workspace = true }

[features]
default = ["build", "arc"]
build = []
serde = ["dep:serde"]
# Forwards to wowsunpack/wows_replays so Arc-backed `Param` storage in the
# provider matches the smart pointer this crate hands back. On by default
# because the rest of the workspace uses Arc; non-arc consumers opt out via
# `default-features = false`.
arc = ["wowsunpack/arc", "wows_replays/arc"]
# wowssb URL helpers (long + short build URLs for app.wowssb.com).
wowssb = ["build", "dep:serde_json", "dep:flate2", "dep:data-encoding"]
# Egui-free normalized battle report + constants resolution. Pulls serde/serde_json
# and enables serde on the crates whose newtypes appear in the report. wows_replays
# has no `serde` feature (serde is a mandatory, non-optional dependency there), so
# only wowsunpack needs the forward. `build` powers consumable-slot resolution;
# `jiff` carries the match timestamp.
battle-report = ["dep:serde_json", "dep:jiff", "serde", "build", "wowsunpack/serde", "personal-rating"]
# The PR data model and formula on their own, with none of the report machinery
# around them. Split out so a consumer that only needs the rating bands (the
# replay search's rating filter) does not pull the whole battle report in.
personal-rating = ["serde", "dep:serde_json"]
