[package]
name = "wgc-placeholder"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Stands in for wgc.exe in the WoWs Toolkit launcher's Wine prefix"

[[bin]]
name = "wgc-placeholder"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.31"

# `wows_buck_build` is set by the Buck build, which drops std and the C runtime.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wows_buck_build)'] }
