[package]
name = "wt-collab-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/landaire/wows-toolkit"
description = "Peer-to-peer collaborative replay sessions for WoWs Toolkit"

[dependencies]
# The wire format and its validation, shared with the web client.
wt-collab-protocol = { workspace = true }
wows_minimap_renderer = { workspace = true }
wows_replays = { workspace = true }
iroh = { workspace = true, default-features = false, features = ["fast-apple-datapath", "portmapper"] }
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
parking_lot = { version = "0.12.5" }
web-time = { workspace = true }
tracing = { workspace = true }
data-encoding = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rand = "0.10"

