[package]
name = "wows-toolkit-viewmodel"
description = "Toolkit logic that decides what the UI shows, independent of any UI toolkit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "wows_toolkit_viewmodel"
path = "src/lib.rs"

[dependencies]
ciborium.workspace = true
# HTML entities in game chat, which the export decodes before writing.
escaper = "0.1.1"
tracing = "0.1"
glob.workspace = true
pickled.workspace = true
jiff.workspace = true
# The Twitch login/in-game-name similarity rule.
levenshtein = "1.0.5"
regex = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wowsunpack = { workspace = true, features = ["arc", "vfs-mmap", "parsing", "rkyv", "models", "json"] }
wows_replays = { workspace = true }
wows-replay-insights = { workspace = true, features = ["arc", "battle-report"] }
wows-toolkit-config = { workspace = true }

[dev-dependencies]
wowsunpack = { workspace = true, features = ["arc", "vfs-mmap", "parsing", "rkyv", "models", "json"] }
