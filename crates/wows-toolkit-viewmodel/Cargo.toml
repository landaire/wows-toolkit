[package]
name = "wows-toolkit-viewmodel"
description = "Toolkit logic that decides what the UI shows, independent of any UI toolkit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "wows_toolkit_viewmodel"
path = "src/lib.rs"

[dependencies]
glob.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wowsunpack = { workspace = true, features = ["vfs", "parsing"] }
wows_replays = { workspace = true }
wows-toolkit-config = { workspace = true }

[dev-dependencies]
wowsunpack = { workspace = true, features = ["vfs", "parsing"] }
