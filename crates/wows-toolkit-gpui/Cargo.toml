[package]
name = "wows-toolkit-gpui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
anyhow.workspace = true
# Matches gpui's own `image` version (0.25.1, see the workspace.dependencies
# comment below) so Cargo unifies both into one crate instance instead of
# resolving two. Only "png" is enabled: the game ships ship-class icons as
# PNG, and that is the only format `icons.rs` decodes.
image = { version = "0.25", default-features = false, features = ["png"] }
# The armor viewport owns its own wgpu device (offscreen render + CPU readback
# into a gpui image). wgpu 29 is already in the graph via gpui's Linux/web
# targets, so this direct dependency unifies to the same version rather than
# pulling a second one; on Windows gpui renders through DirectX and wgpu comes
# only from here.
wgpu = "29"
nalgebra = "0.34"
bytemuck = "1"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
wows-toolkit-config = { path = "../wows-toolkit-config" }
# vfs-mmap: load.rs builds the game VFS directly from a live install
# (wowsunpack::game_data::build_game_vfs_for_build) to run the background
# replay parse; implies vfs + arc + parsing. rkyv: the on-disk GameParams
# cache (game_params::cache), shared with the egui app's identical cache file.
wowsunpack = { path = "../wowsunpack", default-features = false, features = ["arc", "parsing", "vfs-mmap", "rkyv"] }
wows_replays = { path = "../wows-replays", default-features = false, features = ["arc", "parsing", "vfs"] }
wows-replay-insights = { path = "../wows-replay-insights", default-features = false, features = ["arc", "battle-report", "wowssb"] }
wows-battle-world = { path = "../wows-battle-world", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
escaper = "0.1.1"
gettext = "0.4"
rfd = "0.17"

[dev-dependencies]
jiff = "0.2"

[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
# gpui, gpui_platform, and gpui_tokio are deliberately left unpinned (no `rev`):
# gpui-component's own Cargo.toml (github.com/longbridge/gpui-component, out of
# our control) depends on gpui/gpui_platform from this same repo with no rev
# either, and every zed-repo crate (including gpui_tokio) depends on `gpui`
# internally. Cargo treats an explicit-rev git dependency and a floating
# (default-branch) git dependency on the identical URL as two different sources,
# so pinning any one of these three resolves a second, separate zed checkout and
# two incompatible `gpui` crate instances in the same build (verified: `cargo
# build` fails with "there are multiple different versions of crate `gpui`" as
# soon as any of the three carries a `rev`). `[patch]` cannot fix this either --
# Cargo refuses to patch a git source with a different rev of the same URL
# ("patches must point to different sources"). The only clean fix would be
# forking/vendoring gpui-component to pin its internal zed deps too, which is out
# of scope here. Reproducibility instead comes from the committed Cargo.lock,
# which already pins all zed-repo packages (gpui, gpui_platform, gpui_tokio, and
# gpui-component's own gpui/gpui_platform/gpui_web/gpui_macros) to the same
# commit: 058f01fa93503491a735bfded53e77bfaa276148.
gpui           = { git = "https://github.com/zed-industries/zed" }
gpui_platform  = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_tokio     = { git = "https://github.com/zed-industries/zed" }
gpui-component        = { git = "https://github.com/longbridge/gpui-component", rev = "031555662e99a1b5a549990b47f246d475b8288a" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "031555662e99a1b5a549990b47f246d475b8288a" }
anyhow = "1"

# Dormant: flip to gpui-ce here once a gpui-component <-> gpui-ce pairing compiles.
# The HEAD pairing failed on flex/Styled API drift (container_query, flex_grow arity,
# flex_grow_1/flex_shrink_1). See docs/superpowers/specs/2026-07-16-gpui-port-design.md.
# [patch."https://github.com/zed-industries/zed.git"]
# gpui          = { git = "https://github.com/gpui-ce/gpui-ce", rev = "6c799b8e994266233014cea66d7769675ec1967c" }
# gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "6c799b8e994266233014cea66d7769675ec1967c" }
# gpui_web      = { git = "https://github.com/gpui-ce/gpui-ce", rev = "6c799b8e994266233014cea66d7769675ec1967c" }
# gpui_macros   = { git = "https://github.com/gpui-ce/gpui-ce", rev = "6c799b8e994266233014cea66d7769675ec1967c" }
