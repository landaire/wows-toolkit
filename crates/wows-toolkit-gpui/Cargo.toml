[package]
name = "wows-toolkit-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# GPUI Kit is the single application-facing entry point: `gpui_kit::*` is GPUI
# itself, `gpui_kit::component` the styled widget library, `gpui_kit::assets`
# the bundled icon set. GPUI ships as the `gpui-pre-*` crates.io family that
# Kit depends on for us, so there is no git source to unify and no `[patch]`
# block. Pinned by branch; the committed Cargo.lock pins the exact commit.
gpui-kit = { git = "https://github.com/landaire-contrib/gpui-component", branch = "buck-crate-path-fix" }
anyhow = "1"
# Matches gpui's own `image` version so Cargo unifies both into one crate
# instance instead of resolving two. Only "png" is enabled: the game ships
# ship-class icons as PNG, and that is the only format `icons.rs` decodes.
image = { version = "0.25", default-features = false, features = ["png"] }
# The armor viewport owns its own wgpu device (offscreen render + CPU readback
# into a gpui image). wgpu 29 is what GPUI Kit already resolves, so this direct
# dependency unifies to the same version rather than pulling a second one.
wgpu = "29"
nalgebra = "0.34"
bytemuck = "1"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
wows-toolkit-config = { path = "../wows-toolkit-config" }
# The collaborative session mesh, shared with the egui app so both front ends
# run one implementation.
wt-collab-client = { workspace = true }
# A peer's ping carries the session's clock, which is this one.
web-time = { workspace = true }
parking_lot = "0.12.5"
# The Settings tab reports and manages the game-data cache the egui app
# writes: its size, its builds, and the remote repository it came from.
wows-data-mgr = { workspace = true, features = ["constants", "download"] }
# What language the machine reads in, for the question a first run asks.
sys-locale = { workspace = true }
# The process mitigations, applied before a window exists.
wows-toolkit-hardening = { workspace = true }
humansize = "2.1.3"

# Framework-neutral toolkit logic (listing rules, filters, queueing,
# extraction, search), shared with the egui app so the two front ends cannot
# drift apart on what they show.
wows-toolkit-viewmodel = { path = "../wows-toolkit-viewmodel" }
# `i18n!` generates its lookup per crate, so this front end's own chrome needs
# its own invocation; the catalog behind it is parsed once per process
# (`wt_translations::backend`). `wt-translations` also carries the language
# list the settings tab offers.
rust-i18n = { workspace = true }
wt-translations = { workspace = true }
# vfs-mmap: load.rs builds the game VFS directly from a live install
# (wowsunpack::game_data::build_game_vfs_for_build) to run the background
# replay parse; implies vfs + arc + parsing. rkyv: the on-disk GameParams
# cache (game_params::cache), shared with the egui app's identical cache file.
# models: armor_viewer/assets.rs's ShipAssets (ship-export data: assets.bin,
# camo DB).
wowsunpack = { path = "../wowsunpack", default-features = false, features = ["arc", "parsing", "vfs-mmap", "rkyv", "models"] }
wows_replays = { path = "../wows-replays", default-features = false, features = ["arc", "parsing", "vfs"] }
wows-replay-insights = { path = "../wows-replay-insights", default-features = false, features = ["arc", "battle-report", "wowssb", "fire-sections"] }
wows-battle-world = { path = "../wows-battle-world", default-features = false }
# The hover preview rasterises the same draw commands the egui popup paints
# and the video export encodes, rather than this crate growing a second
# minimap renderer.
wows_minimap_renderer = { path = "../minimap-renderer", default-features = false, features = ["rendering"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
# The personal-rating refresh and the live match-stats lookup, the two network
# fetches this crate makes. Matches the egui app's feature set so both resolve
# one copy.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
# The chat poll behind the roster's possible-stream-sniper chip. Same version
# and features as the egui app, so the two resolve one Twitch client.
twitch_api = { version = "0.7.2", features = [
    "helix",
    "client",
    "reqwest",
] }
# CBOR is what the match-stats service speaks, and one of the replay
# export formats.
ciborium = "0.2"
# The replay export's spreadsheet format.
csv = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite"] }
# The recent-games input accepts digits only, which NumberInput takes as a
# pattern.
regex = "1"
# Time periods for the Player Tracker window.
jiff = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time", "time"] }
# The rotated log file a bug report is copied from.
tracing-appender = "0.2"
thiserror = "2.0"
escaper = "0.1.1"
gettext = "0.4"
rfd = "0.17"
# ASCII-folded search names for the armor viewer's ship catalog, matching the
# egui app's `ShipCatalog::build` and wowsunpack's own pinned version.
unidecode = "0.3"
# Channels for streaming extraction progress from the background pool back to
# the view. Already in the graph under GPUI; this names it directly.
futures = "0.3"
# The replays-directory watch behind "Autoload Latest Replay". Same version as
# the egui app's, so both resolve one copy.
notify = "8.2.0"
# A file-list clipboard payload, which GPUI's own clipboard has no format for:
# "Copy Replay" puts the file on the clipboard so it pastes into a file
# manager, not its path as text. Same version as the egui app's.
arboard = "3.6.1"
# `--help`, `--version`, and a refusal for an argument this build does not take.
clap = { workspace = true }
# A render put on the clipboard needs a file that outlives this process.
tempfile = "3"
# Copying a chart as an image draws it a second time without a window:
# tiny-skia for the geometry, ab_glyph for the glyphs, and fontdb to find a
# system face that covers the text. Nothing is bundled, so a chart in
# Japanese or Russian is drawn with the same faces the desktop uses.
tiny-skia = "0.12"
ab_glyph = "0.2"
fontdb = "0.23"

# A release build has no console, so `--help`, `--version` and a refused
# argument are written to the parent's console or shown in a message box.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

# The executable's icon, which is what Windows shows on the window, in the
# taskbar and in Explorer.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

# `wows_buck_build` is set by the Buck build, which compiles the Windows
# resources with its own pinned rc.exe instead of the build script's.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wows_buck_build)'] }

[dev-dependencies]
# Kit's UI test harness: `#[gpui_kit::test]`, headless windows, and the
# pointer/keyboard dispatch used by the interaction tests. Enabling it here
# keeps it out of release builds; `.test_support()` in the views is inert
# without it.
gpui-kit = { git = "https://github.com/landaire-contrib/gpui-component", branch = "buck-crate-path-fix", features = ["test-support"] }
jiff = "0.2"
# Lets the tests point `storage_dir` at a temporary directory, so no test
# reads or writes the running user's own data.
wows-toolkit-config = { path = "../wows-toolkit-config", features = ["test-support"] }
# Setting an mtime explicitly, so a test can order two files written in the
# same moment.
filetime = "0.2"
