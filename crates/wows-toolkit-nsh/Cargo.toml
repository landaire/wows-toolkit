[package]
name = "wows-toolkit-nsh"
version.workspace = true
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
[features]
buck = []


[dependencies]
# Rendered videos go on the clipboard as a file list.
arboard = "3.6.1"
image = { workspace = true, features = ["png"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
# Both rustls providers are in the dependency graph, so one is installed at
# startup; without it the first TLS client panics.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time", "time", "tracing-log"] }
log = "0.4"
jiff = { workspace = true }
nsh-base = "0.4.0"
nsh-core = "0.4.0"
nsh-bundler = "0.4.0"
png = "0.18"
rust-i18n = { workspace = true }
sys-locale = { workspace = true }
wt-translations = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
tiny-skia = "0.12"
thiserror = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time"] }
tempfile = "3.27.0"
unidecode = "0.3"
wows_replays = { path = "../wows-replays", default-features = false, features = ["parsing", "arc"] }
wows-core = { path = "../wows-core" }
wows-replay-insights = { path = "../wows-replay-insights", default-features = false, features = ["arc", "battle-report", "wowssb", "fire-sections"] }
sqlx = { workspace = true }
url = "2.5.8"
wows-toolkit-armor = { path = "../wows-toolkit-armor" }
wows-toolkit-config = { path = "../wows-toolkit-config" }
wows-toolkit-replay-data = { path = "../wows-toolkit-replay-data" }
# The CPU encoders, so an export works on a machine with no GPU encoder.
wows_minimap_renderer = { path = "../minimap-renderer", default-features = false, features = ["rendering", "cpu", "cpu-av1"] }
wowsunpack = { path = "../wowsunpack", default-features = false, features = ["arc", "parsing", "vfs-mmap", "rkyv", "models", "json"] }
wt-collab-client = { workspace = true }
wows-toolkit-viewmodel = { path = "../wows-toolkit-viewmodel" }
wows-data-mgr = { workspace = true, features = ["constants", "download"] }
wows-toolkit-launcher = { path = "../wows-toolkit-launcher" }
wows-toolkit-hardening = { path = "../wows-toolkit-hardening" }
wgc-auth = { path = "../wgc-auth" }
wgc-catalog = { path = "../wgc-catalog" }
wgc-download = { path = "../wgc-download" }
wgc-install = { path = "../wgc-install" }
humansize = "2.1.3"
# Battles landing in the game's replay directory queue an index pass.
notify = "8.2.0"

[target.'cfg(target_os = "linux")'.dependencies]
#[cfg] The TSX interface runs through QuickJS.
nsh-platform-linux = { version = "0.4.0", default-features = false, features = ["js"] }

[dev-dependencies]
wows-toolkit-launcher = { path = "../wows-toolkit-launcher", features = ["test-support"] }
wows-toolkit-config = { path = "../wows-toolkit-config", features = ["test-support"] }
nsh-engine = { version = "0.4.0", default-features = false }
nsh-testing = { version = "0.4.0", features = ["bundle"] }
# The session state a tactics board test hands a link.
parking_lot = "0.12"
