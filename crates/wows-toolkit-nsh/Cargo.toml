[package]
name = "wows-toolkit-nsh"
version.workspace = true
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
[features]
buck = []


[dependencies]
base64 = "0.22"
env_logger = "0.11"
log = "0.4"
jiff = { workspace = true }
nsh-base = "0.4.0"
nsh-core = "0.4.0"
nsh-bundler = "0.4.0"
png = "0.18"
rust-i18n = { workspace = true }
sys-locale = { workspace = true }
wt-translations = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
tiny-skia = "0.12"
thiserror = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
tempfile = "3.27.0"
wows_replays = { path = "../wows-replays", default-features = false, features = ["parsing", "arc"] }
wows-core = { path = "../wows-core" }
sqlx = { workspace = true }
url = "2.5.8"
wows-toolkit-config = { path = "../wows-toolkit-config" }
wows-toolkit-viewmodel = { path = "../wows-toolkit-viewmodel" }
wows-toolkit-replay-data = { path = "../wows-toolkit-replay-data" }
wows-data-mgr = { workspace = true, features = ["constants", "download"] }
wowsunpack = { path = "../wowsunpack", default-features = false, features = ["arc", "parsing", "vfs-mmap", "rkyv"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
# Tactics board: map art, capture layouts, the session link, and PNG art for
# peers.
image = { workspace = true, features = ["png"] }
wows_minimap_renderer = { workspace = true, features = ["rendering"] }
wows-replay-insights = { workspace = true, features = ["arc", "battle-report"] }
wt-collab-client = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
#[cfg] The TSX interface runs through QuickJS.
nsh-platform-linux = { version = "0.4.0", default-features = false, features = ["js"] }

[dev-dependencies]
wows-toolkit-config = { path = "../wows-toolkit-config", features = ["test-support"] }
nsh-engine = { version = "0.4.0", default-features = false }
nsh-testing = { version = "0.4.0", features = ["bundle"] }
# The session state a tactics board test hands a link.
parking_lot = "0.12"
