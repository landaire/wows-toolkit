[package]
name = "wows-toolkit-nsh"
version.workspace = true
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
[features]
buck = []


[dependencies]
base64 = "0.22"
env_logger = "0.11"
log = "0.4"
nsh-base = "0.4.0"
nsh-core = "0.4.0"
nsh-bundler = "0.4.0"
png = "0.18"
rust-i18n = { workspace = true }
sys-locale = { workspace = true }
wt-translations = { workspace = true }
serde_json = "1.0"
tiny-skia = "0.12"
tokio = { version = "1", default-features = false, features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
#[cfg] The TSX interface runs through QuickJS.
nsh-platform-linux = { version = "0.4.0", default-features = false, features = ["js"] }

[dev-dependencies]
nsh-engine = { version = "0.4.0", default-features = false }
nsh-testing = { version = "0.4.0", features = ["bundle"] }
