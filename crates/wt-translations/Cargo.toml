[package]
exclude = ["BUCK"]
name = "wt-translations"
version = "0.17.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/landaire/wows-toolkit"
description = "Translation key mappings, TextResolver trait, and language metadata for WoWs Toolkit"

[dependencies]
wows-core = { workspace = true }
# The translation catalog is TOML, and `rust_i18n::Backend` is what serves it
# to `t!` in every crate that translates.
rust-i18n = { workspace = true }
toml = { workspace = true }
