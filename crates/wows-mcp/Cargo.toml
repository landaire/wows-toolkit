[package]
name = "wows-mcp"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP server answering World of Warships game data questions"

[dependencies]
wows-query = { workspace = true, features = ["download"] }
clap = { workspace = true }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
# rustls without a crypto provider; rustls-graviola is installed at startup.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots-no-provider"] }
rmcp = { version = "3.9", default-features = false, features = ["macros", "server", "transport-io", "transport-streamable-http-server"] }
rootcause = { workspace = true }
rustls-graviola = "0.4"
schemars = "1.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
