[package]
name = "wows-query"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Query World of Warships game data: ships, armor, shells, stat cards, captain skills, upgrades, consumables and raw GameParams"

[dependencies]
wowsunpack = { workspace = true, features = ["arc", "json", "models", "rkyv", "serde", "vfs"] }
wows-core = { workspace = true, features = ["arc", "schemars", "serde"] }
wows-ship-stats = { workspace = true }
wows-data-mgr = { workspace = true }
wows_replays = { workspace = true, features = ["arc", "parsing", "vfs"] }
replayshark = { workspace = true }
deunicode = "1"
flate2 = { workspace = true }
gettext = { workspace = true }
jaq-core = "3.1"
jaq-json = { version = "2.0", features = ["serde"] }
jaq-std = "3.0"
reqwest = { version = "0.12", default-features = false, optional = true }
rootcause = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
# Tool answers and schemas keep struct field order.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Caps the address space and descriptors of jq and replay workers.
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Denies jq and replay workers filesystem access.
landlock = "0.4"

[features]
default = []
# Downloads the newest published game data build. The caller installs a rustls
# crypto provider before building the `reqwest::Client` it passes in.
download = ["wows-data-mgr/download", "dep:reqwest"]

[build-dependencies]
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
