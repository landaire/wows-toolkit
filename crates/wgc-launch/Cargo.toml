[package]
name = "wgc-launch"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Launch World of Warships natively (Windows) or via Proton (Linux)"

[dependencies]
wgc-core = { workspace = true }
wgc-install = { workspace = true }
serde = { workspace = true }
tempfile = "3"
thiserror = "2"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
insta = { workspace = true }
