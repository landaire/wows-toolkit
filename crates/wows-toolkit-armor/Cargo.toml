[package]
name = "wows-toolkit-armor"
description = "Armor Viewer scene logic and wgpu viewport engine, independent of any UI toolkit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "wows_toolkit_armor"
path = "src/lib.rs"

[features]
# The headless test device, for the tests of crates that host the viewport.
test-support = ["dep:pollster"]

[dependencies]
bytemuck = { workspace = true }
# Camouflage tiles arrive as PNG.
image = { workspace = true, features = ["png"] }
nalgebra = "0.34"
# The headless test device's adapter and device requests.
pollster = { version = "0.4", optional = true }
rootcause = { workspace = true }
# `i18n!` generates its lookup per crate; the catalog behind it is parsed once
# per process (see `wt_translations::backend`).
rust-i18n = { workspace = true }
# The lighting settings a host persists.
serde = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
# Replay hits and health over time, for the shot overlays.
wows-replay-insights = { workspace = true, features = ["arc", "build"] }
wows_replays = { workspace = true, features = ["arc"] }
# The typed-text filter matching shared with the other listings.
wows-toolkit-viewmodel = { workspace = true }
# The saved Armor Viewer defaults the scene options start from.
wows-toolkit-config = { workspace = true }
wt-translations = { workspace = true }
# The wgpu instance GPUI's renderer uses, so a host can pass its own device in.
wgpu = { workspace = true }
# Ship, model and armor loading, and the ray-triangle test the picking shares
# with the armor export.
wowsunpack = { workspace = true, features = ["arc", "parsing", "models"] }

[dev-dependencies]
# The real-catalogue test names models in English.
gettext = { workspace = true }
pollster = "0.4"
serde_json = { workspace = true }
