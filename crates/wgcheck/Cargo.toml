[package]
name = "wgcheck"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Parser for WGCheck (.gch) report archives: DES + GZip + .NET BinaryFormatter (NRBF)"

[dependencies]
rootcause = { workspace = true }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
des = "0.8"
cbc = "0.1"

[[bin]]
name = "wgcheck"
path = "src/main.rs"
