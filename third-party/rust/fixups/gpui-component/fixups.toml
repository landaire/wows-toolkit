# Only republishes gpui-kit-assets' icon directory through an environment
# variable that nothing in the crate reads.
buildscript.run = false

# test-support is for the GPUI tests only. They reach it through the
# //build-support/buck/test-support:transition incoming transition, so the
# shipped binaries build without it.
rustc_flags_select = [{ "DEFAULT" = [], "root//build-support/buck/test-support:enabled" = ["--cfg=feature=\"test-support\""] }]
