# Emits check-cfg lines and cfgs from unset environment variables, and embeds a
# Windows manifest when the windows-manifest feature is on, which needs rc.exe
# from host state.
buildscript.run = false

# test-support is for the GPUI tests only. They reach it through the
# //build-support/buck/test-support:transition incoming transition, so the
# shipped binaries build without it.
# proptest and test-support need these. They stay unused, and so unlinked,
# elsewhere.
extra_deps = [":futures-concurrency-7", ":postage-0.5", ":proptest-1", ":web-time-1"]
rustc_flags_select = [{ "DEFAULT" = [], "root//build-support/buck/test-support:enabled" = ["--cfg=feature=\"proptest\"", "--cfg=feature=\"test-support\"", "--cfg=feature=\"wayland\"", "--cfg=feature=\"x11\""] }]
