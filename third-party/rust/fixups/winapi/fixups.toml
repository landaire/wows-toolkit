# The upstream reindeer template links winapi's Windows import libraries via a
# `shim//third-party/toolchains/win:*.lib` cell that this repo does not define.
# The buck build targets Linux (Windows releases build via cargo), so those
# import libs are never linked here; keeping the shim references only breaks
# buckification of the whole third-party graph. winapi is a windows-only crate
# pulled transitively (steamroom-client -> dirs-next); on non-windows it is a
# no-op, so no buildscript and no extra deps are needed.
buildscript.run = false
