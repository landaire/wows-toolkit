[buildscript.run]
env = {
    CARGO_PKG_HOMEPAGE = "",
    CARGO_PKG_LICENSE = "BSD-2-Clause",
    NUM_JOBS = "1",
    RUSTDOC = "rustdoc",
}
# The build script assembles the hand-tuned x86 SIMD with NASM into a static
# library; without these the symbols it emits never reach the link.
rustc_link_lib = true
rustc_link_search = true

['cfg(target_arch = "aarch64")']
omit_features = ["asm"]
