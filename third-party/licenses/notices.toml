# Crates Buck links that cargo-about's resolution leaves out. cargo-about does
# not follow the weak dependency feature `icu_locale_fallback?/compiled_data` of
# icu_segmenter, which the workspace enables. `files` are read from the crate.
[[unresolved_crate]]
name = "icu_locale_fallback_data"
license = "Unicode-3.0"
files = ["LICENSE"]

# fontique's `system` feature enables it on Linux, where zgui links it, but
# cargo-about leaves it out.
[[unresolved_crate]]
name = "yeslogic-fontconfig-sys"
license = "MIT"
files = ["LICENSE"]

# Crates whose license text cargo-about cannot give with the copyright notice
# their license requires. `crate_files` are read from the crate, then `files`
# from this repository. `version` makes an update recheck the entry.

# The package has no license file. The copyright holder is from its README.
[[crate_license]]
name = "openh264"
version = "0.9.8"
license = "BSD-2-Clause"
files = ["third-party/licenses/texts/openh264-rs.txt"]

# LICENSE gathers the license and copyright lines of every bundled AWS-LC
# source, which cargo-about cannot divide among the licenses it names.
[[crate_license]]
name = "aws-lc-sys"
version = "0.47.0"
license = "ISC AND (Apache-2.0 OR ISC) AND Apache-2.0 AND MIT AND BSD-3-Clause AND (Apache-2.0 OR ISC OR MIT) AND (Apache-2.0 OR ISC OR MIT-0)"
crate_files = ["LICENSE"]

# The packaged license files hold no copyright line, which askalono does not
# match, so cargo-about gives the template with placeholders.
[[crate_license]]
name = "libm"
