# Inputs of scripts/update_third_party_notices.nu other than about.toml.

# Every package whose build is distributed. Its dependencies are resolved with
# the features of the whole workspace, as Buck resolves them. Without `targets`,
# a root is resolved for the targets about.toml names.

# The desktop app.
[[root]]
manifest = "crates/wows-toolkit/Cargo.toml"

# The command-line tools archive, build-support/release-tools.json.
[[root]]
manifest = "crates/wowsunpack/Cargo.toml"

[[root]]
manifest = "crates/wows-data-mgr/Cargo.toml"

[[root]]
manifest = "crates/replayshark/Cargo.toml"

[[root]]
manifest = "crates/minimap-renderer/Cargo.toml"

# The web clients GitHub Pages serves.
[[root]]
manifest = "crates/wt-web/Cargo.toml"
targets = ["wasm32-unknown-unknown"]

[[root]]
manifest = "crates/wt-replay-demo/Cargo.toml"
targets = ["wasm32-unknown-unknown"]

# Components that are not Rust crates, or that a crate bundles under a license
# its manifest does not declare. `offered` is the license choice the authors
# give; `license` is the one WoWs Toolkit distributes the component under. A
# file with a `crate` is read from that crate's source, any other from this
# repository. A crate named here must be in the dependency graph.

[[component]]
name = "Zstandard"
version = "1.5.7"
license = "BSD-3-Clause"
offered = "BSD-3-Clause OR GPL-2.0-only"
url = "https://github.com/facebook/zstd"
contained_in = "zstd-sys"
files = [{ crate = "zstd-sys", path = "zstd/LICENSE" }]

[[component]]
name = "SQLite"
version = "3.46.0"
license = "blessing"
url = "https://sqlite.org"
contained_in = "libsqlite3-sys"
files = [{ path = "third-party/licenses/texts/sqlite.txt" }]

[[component]]
name = "Vulkan Memory Allocator"
version = "3.1.0-development"
license = "MIT"
url = "https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator"
