<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WoWs Toolkit - Replay Demo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1b1b1b;
            color: #ccc;
        }
        html.light, html.light body {
            background: #f8f8f8;
            color: #444;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .loading, .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: sans-serif;
        }
        .error {
            max-width: 80%;
            text-align: center;
        }
    </style>
    <script>
        // Match the page behind the canvas to the theme the app is about to use.
        (function () {
            var theme = new URLSearchParams(location.search).get('theme');
            var light = theme === 'light'
                || (theme !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
            if (light) document.documentElement.className = 'light';
        })();
    </script>
</head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <div class="loading" id="loading">Loading replay demo</div>
    <script>
        // eframe draws over the message once the module starts.
        window.addEventListener('load', function () {
            var el = document.getElementById('loading');
            if (el) el.remove();
        });
    </script>
</body>
</html>
