name: Buck

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

# Builds every public binary through the native Buck graph and proves the graph
# stays hermetic. Buck downloads crate sources itself, each checked against the
# checksum Cargo.lock pins or fetched at its locked commit.

# root//: is every alias declared in the root BUCK file, so adding one does not
# mean remembering to add it here as well.
env:
  ALIASES: "root//:"

jobs:
  # Three phases of the same graph, run as separate jobs so their wall clock
  # overlaps instead of adding up. Each pays its own provisioning and starts
  # from a cold buck-out, which is still cheaper in wall clock than the serial
  # run it replaces.
  linux:
    name: Linux x86_64 (${{ matrix.phase }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        phase: [checks, release, graph-tests]
    steps:
      - uses: actions/checkout@v4

      # The wt-web site's release link runs ThinLTO over the whole wasm graph
      # in one rustc, which outgrows the runner's 16 GB on its own.
      - name: Expand runner swap
        if: matrix.phase == 'release'
        run: bash scripts/expand-runner-swap.sh 16

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      # Installs DotSlash and the Buck2 release toolchains/buck2 pins, then the
      # toolchain. Every step after it is a buck2 command; the devShell puts
      # bin/buck2 first on PATH, so the scripts behind //ci run the same Buck2.
      - name: Bootstrap Buck2 and the toolchain
        run: ./bootstrap.sh

      - name: Build every alias
        if: matrix.phase == 'checks'
        run: nix develop --command buck2 build $ALIASES

      - name: Build every alias in release mode
        if: matrix.phase == 'release'
        run: nix develop --command buck2 build -m release $ALIASES

      - name: Check the action graph is hermetic
        if: matrix.phase == 'checks'
        run: nix develop --command buck2 run //ci:hermetic

      # bxl/lint.bxl builds the [clippy.json] sub-target of every first-party
      # rust target in one invocation, and lint.nu decides pass or fail from
      # the diagnostics: the prelude builds them with infallible_diagnostics,
      # so the action succeeds even when compilation does not.
      - name: Lint
        if: matrix.phase == 'checks'
        run: nix develop --command buck2 run //ci:lint

      # The crates' tests, and the checks over the repository's own pins and
      # manifests.
      - name: Test
        if: matrix.phase == 'checks'
        run: nix develop --command buck2 test root//crates/... root//ci/...

      - name: Build-graph tests
        if: matrix.phase == 'graph-tests'
        run: nix develop --command buck2 run //ci:graph_tests

  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      - name: Bootstrap Buck2 and the toolchain
        run: ./bootstrap.sh

      # One mode only: macOS runner minutes bill at a multiple of Linux, and the
      # graph itself is already covered there in both modes. The tactics site is
      # host-independent, and its release link needs more memory than this
      # runner has, so only Linux builds it.
      - name: Build every alias
        run: |
          nix develop --command bash -euo pipefail -c '
            aliases=$(buck2 uquery "$ALIASES - root//:wt_web_site")
            buck2 build -m release --target-platforms toolchains//platforms:macos_arm64 $aliases
          '

# Windows is absent as a CI job. It builds and releases from the graph, but
# provisioning mirrors a multi-GB Visual Studio layout on every run because
# nothing is cached, so it is left to the release workflow until then.
