name: Buck

on:
  push:
    branches: [main]
  pull_request:

# Builds every public binary through the native Buck graph and proves the graph
# stays hermetic. Provisioning is the only step allowed to reach the network:
# the job drops its network access before the first Buck action runs.

env:
  ALIASES: >-
    //:wows_toolkit //:wowsunpack //:wows_data_mgr //:replayshark
    //:minimap_renderer //:wgcheck //:dhat_load //:profile_replay //:dhat_parse

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      # Realize every store path and crate source Buck will need, while the
      # network is still up.
      - name: Provision the toolchain and crate sources
        run: nix develop --command nu scripts/refresh-buck-toolchain.nu

      - name: Disable network access
        run: |
          sudo iptables -P OUTPUT DROP
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo ip6tables -P OUTPUT DROP || true
          sudo ip6tables -A OUTPUT -o lo -j ACCEPT || true

      - name: Build every alias
        run: nix develop --command buck2 build $ALIASES

      - name: Build every alias in release mode
        run: nix develop --command buck2 build -c native_build.mode=release $ALIASES

      - name: Check the action graph is hermetic
        run: |
          for alias in $ALIASES; do
            nix develop --command nu scripts/check-buck-hermetic.nu "$alias"
            nix develop --command nu scripts/check-buck-hermetic.nu "$alias" release
          done

      - name: Buck build-graph tests
        run: |
          for test in scripts/test-*.nu; do
            nix develop --command nu "$test"
          done

# macOS and Windows are deliberately absent. Both build locally, but neither has
# ever passed here:
#
#   macOS  - build-support/check-xcode.nu pins Xcode 26.6 and the MacOSX26.5
#            SDK. The runners carry Xcode 16.4, and `nix develop` points
#            DEVELOPER_DIR at the flake's own Apple SDK regardless, so the pin
#            cannot hold as written.
#   Windows- provision-toolchain.ps1 downloads a multi-GB Visual Studio and SDK
#            layout whose hashes are still unverified against a real download.
#
# Until those are settled, run them by hand:
#   buck2 build --target-platforms toolchains//platforms:macos_arm64 //:wows_toolkit
#   buck2 build --target-platforms toolchains//windows:windows_x86_64_msvc //:wows_toolkit
