name: Buck

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  # A manual run checks everything.
  workflow_dispatch:

# Builds the public binaries through the native Buck graph and proves the graph
# stays hermetic. Buck downloads crate sources itself, each checked against the
# checksum Cargo.lock pins or fetched at its locked commit.
#
# Each run checks only the first-party targets whose code or dependencies differ
# from the last successful run on main (ci/affected.nu). A change to the build
# configuration, toolchains, or the checks themselves checks everything.

permissions:
  contents: read
  # Finding the last successful run on main.
  actions: read

jobs:
  # Three phases of the same graph, run as separate jobs so their wall clock
  # overlaps instead of adding up. Each pays its own provisioning and starts
  # from a cold buck-out, which is still cheaper in wall clock than the serial
  # run it replaces.
  linux:
    name: Linux x86_64 (${{ matrix.phase }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        phase: [checks, release, graph-tests]
    steps:
      - uses: actions/checkout@v4

      # The wt-web site's release link runs ThinLTO over the whole wasm graph
      # in one rustc, which outgrows the runner's 16 GB on its own.
      - name: Expand runner swap
        if: matrix.phase == 'release'
        run: bash scripts/expand-runner-swap.sh 16

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      # Installs DotSlash and the Buck2 release toolchains/buck2 pins, then the
      # toolchain. Every step after it is a buck2 command; the devShell puts
      # bin/buck2 first on PATH, so the scripts behind //ci run the same Buck2.
      - name: Bootstrap Buck2 and the toolchain
        run: ./bootstrap.sh

      - name: Select the affected targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            nix develop --command buck2 run //ci:affected -- --full --out affected.json
            exit 0
          fi
          # No answer means no base, which checks everything.
          base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/buck.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""') || base=""
          nix develop --command buck2 run //ci:affected -- --base "$base" --out affected.json

      - name: Build the affected aliases
        if: matrix.phase == 'checks'
        run: |
          aliases=$(jq -r '.aliases | join(" ")' affected.json)
          if [ -z "$aliases" ]; then echo "No alias is affected."; exit 0; fi
          nix develop --command buck2 build $aliases

      - name: Build the affected aliases in release mode
        if: matrix.phase == 'release'
        run: |
          aliases=$(jq -r '.aliases | join(" ")' affected.json)
          if [ -z "$aliases" ]; then echo "No alias is affected."; exit 0; fi
          nix develop --command buck2 build -m release $aliases

      - name: Check the action graph is hermetic
        if: matrix.phase == 'checks'
        run: |
          if jq -e .full affected.json >/dev/null; then
            nix develop --command buck2 run //ci:hermetic
            exit 0
          fi
          aliases=$(jq -r '.aliases | join(" ")' affected.json)
          if [ -z "$aliases" ]; then echo "No alias is affected."; exit 0; fi
          nix develop --command buck2 run //ci:hermetic -- $aliases

      # bxl/lint.bxl builds the [clippy.json] sub-target of every first-party
      # rust target in one invocation, and lint.nu decides pass or fail from
      # the diagnostics: the prelude builds them with infallible_diagnostics,
      # so the action succeeds even when compilation does not.
      - name: Lint
        if: matrix.phase == 'checks'
        run: |
          lint=$(jq -r '.lint // empty' affected.json)
          if [ -z "$lint" ]; then echo "No first-party Rust target is affected."; exit 0; fi
          nix develop --command buck2 run //ci:lint -- --target "$lint"

      # The crates' tests, and the checks over the repository's own pins and
      # manifests.
      - name: Test
        if: matrix.phase == 'checks'
        run: nix develop --command buck2 test $(jq -r '.tests | join(" ")' affected.json)

      - name: Build-graph tests
        if: matrix.phase == 'graph-tests'
        run: |
          if ! jq -e .graph_tests affected.json >/dev/null; then echo "No BUCK file or manifest changed."; exit 0; fi
          nix develop --command buck2 run //ci:graph_tests

  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      - name: Bootstrap Buck2 and the toolchain
        run: ./bootstrap.sh

      - name: Select the affected targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            nix develop --command buck2 run //ci:affected -- --full --out affected.json
            exit 0
          fi
          base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/buck.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""') || base=""
          nix develop --command buck2 run //ci:affected -- --base "$base" --out affected.json

      # One mode only: macOS runner minutes bill at a multiple of Linux, and the
      # graph itself is already covered there in both modes. The tactics site is
      # host-independent, and its release link needs more memory than this
      # runner has, so only Linux builds it.
      - name: Build the affected aliases
        run: |
          aliases=$(jq -r '.aliases | join(" ")' affected.json)
          if [ -z "$aliases" ]; then echo "No alias is affected."; exit 0; fi
          nix develop --command bash -euo pipefail -c '
            targets=$(buck2 uquery "set($0) - root//:wt_web_site")
            if [ -z "$targets" ]; then echo "No alias is affected."; exit 0; fi
            buck2 build -m release --target-platforms toolchains//platforms:macos_arm64 $targets
          ' "$aliases"

# Windows is absent as a CI job. It builds and releases from the graph, but
# provisioning mirrors a multi-GB Visual Studio layout on every run because
# nothing is cached, so it is left to the release workflow until then.
