name: Buck

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

# Builds every public binary through the native Buck graph and proves the graph
# stays hermetic. Provisioning is the only step allowed to reach the network:
# every Buck step after it runs in a network namespace of its own.

# root//: is every alias declared in the root BUCK file, so adding one does not
# mean remembering to add it here as well.
env:
  ALIASES: "root//:"

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      # Realize every store path and crate source Buck will need, while the
      # network is still up.
      - name: Provision the toolchain and crate sources
        run: nix develop --command nu scripts/refresh-buck-toolchain.nu

      # Fails with a clear message if the vendored prelude was expanded from a
      # different buck2 than the pinned one, before the load-time error would.
      - name: Verify the vendored prelude matches the pinned buck2
        run: nix build .#checks.x86_64-linux.prelude-version -L

      # Every step below runs Buck without a network, run-offline.sh explains
      # why each one needs the wrapper rather than the build steps alone.
      - name: Build every alias
        run: nix develop --command bash scripts/run-offline.sh buck2 build $ALIASES

      - name: Build every alias in release mode
        run: nix develop --command bash scripts/run-offline.sh buck2 build -c native_build.mode=release $ALIASES

      - name: Check the action graph is hermetic
        run: |
          for alias in $(nix develop --command buck2 targets $ALIASES); do
            nix develop --command bash scripts/run-offline.sh nu scripts/check-buck-hermetic.nu "$alias"
            nix develop --command bash scripts/run-offline.sh nu scripts/check-buck-hermetic.nu "$alias" release
          done

      # bxl/lint.bxl builds the [clippy.json] sub-target of every first-party
      # rust target in one invocation, and lint.nu decides pass or fail from
      # the diagnostics: the prelude builds them with infallible_diagnostics,
      # so the action succeeds even when compilation does not.
      - name: Lint through Buck
        run: nix develop --command bash scripts/run-offline.sh nu scripts/lint.nu

      - name: Run the unit tests through Buck
        run: nix develop --command bash scripts/run-offline.sh buck2 test root//crates/...

      - name: Buck build-graph tests
        run: |
          for test in scripts/test-*.nu; do
            nix develop --command bash scripts/run-offline.sh nu "$test"
          done

  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      - name: Provision the toolchain and crate sources
        run: nix develop --command nu scripts/refresh-buck-toolchain.nu

      # One mode only: macOS runner minutes bill at a multiple of Linux, and the
      # graph itself is already covered there in both modes.
      - name: Build every alias
        run: |
          nix develop --command buck2 build -c native_build.mode=release --target-platforms toolchains//platforms:macos_arm64 $ALIASES

# Windows is absent as a CI job. It builds and releases from the graph, but
# provisioning mirrors a multi-GB Visual Studio layout on every run because
# nothing is cached, so it is left to the release workflow until then.
