name: Deploy site to GitHub Pages

on:
  # Deploy on every push to main (site content updates), and rebuild the
  # tactics WASM on a release tag. The release is cut by build.yml using
  # GITHUB_TOKEN, which suppresses the release event, so we key off the tag.
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  # Also rebuild tactics for a manually published release.
  release:
    types: [published]
  # Manual trigger, optionally skipping the tactics rebuild.
  workflow_dispatch:
    inputs:
      build_tactics:
        description: "Rebuild tactics WASM app"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, queued rather than cancelled. Cancelling loses
# the tag and release runs, which are the only ones that rebuild tactics: a
# release tag is pushed alongside a main push, and the main run would cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUILD_TACTICS: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_tactics) }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand runner swap
        if: env.BUILD_TACTICS == 'true'
        run: ./scripts/expand-runner-swap.sh 16G

      - name: Install Nix
        if: env.BUILD_TACTICS == 'true'
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cachix
        if: env.BUILD_TACTICS == 'true'
        uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      # Exports the devShell into GITHUB_ENV so rust-cache finds rustc on PATH
      # and keys the cache on the toolchain the build actually uses. Pinned by
      # sha: this action writes GITHUB_ENV and GITHUB_PATH for the whole job,
      # so a hijacked floating tag could poison every later step.
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
        if: env.BUILD_TACTICS == 'true'

      # Keyed to match warm-release-cache.yml. The tactics build only runs on
      # tags and releases, so this key is populated from main and never
      # written back here.
      - uses: Swatinem/rust-cache@v2
        if: env.BUILD_TACTICS == 'true'
        with:
          shared-key: wasm-release
          save-if: "false"

      - name: Build wt-web WASM app
        if: env.BUILD_TACTICS == 'true'
        env:
          # Release-mode wasm codegen at full runner parallelism exhausts the
          # 16 GB hosted runner and it gets killed with no diagnostic.
          CARGO_BUILD_JOBS: "2"
          # The wasm name section is dead weight over the wire. Desktop builds
          # keep their symbols so the panic hook's backtrace stays readable.
          # Must match warm-release-cache.yml or the cached artifacts
          # fingerprint differently and get rebuilt.
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: nix develop --command trunk build --release --public-url /wows-toolkit/tactics/
        working-directory: crates/wt-web

      - name: Save tactics build to cache
        if: env.BUILD_TACTICS == 'true'
        uses: actions/cache/save@v4
        with:
          path: crates/wt-web/dist
          key: tactics-dist-${{ github.sha }}

      - name: Restore tactics build from cache
        if: env.BUILD_TACTICS != 'true'
        uses: actions/cache/restore@v4
        with:
          path: crates/wt-web/dist
          key: tactics-dist-will-not-match
          restore-keys: tactics-dist-

      - name: Assemble deploy directory
        run: |
          mkdir -p _deploy/tactics
          cp -r site/* _deploy/
          if [ -d crates/wt-web/dist ] && [ "$(ls -A crates/wt-web/dist)" ]; then
            cp -r crates/wt-web/dist/* _deploy/tactics/
          elif [ "$BUILD_TACTICS" = "true" ]; then
            echo "::error::The tactics build ran but produced no output in crates/wt-web/dist."
            exit 1
          else
            echo "::warning::No tactics build found in cache. Deploying site without tactics."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
