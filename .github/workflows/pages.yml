name: Deploy site to GitHub Pages

on:
  # Publish only stable releases. Development and prerelease changes do not
  # update the production site.
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize release deployments.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Expand runner swap
        run: bash scripts/expand-runner-swap.sh 16

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cachix
        uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      # Exports the devShell into GITHUB_ENV so rust-cache finds rustc on PATH
      # and keys the cache on the toolchain the build actually uses. Pinned by
      # sha: this action writes GITHUB_ENV and GITHUB_PATH for the whole job,
      # so a hijacked floating tag could poison every later step.
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1

      # Use the release build cache to reduce compile time.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-release
          save-if: "false"

      - name: Build wt-web WASM app
        env:
          # Release-mode wasm codegen at full runner parallelism exhausts the
          # 16 GB hosted runner and it gets killed with no diagnostic.
          CARGO_BUILD_JOBS: "2"
          # The wasm name section is dead weight over the wire. Desktop builds
          # keep their symbols so the panic hook's backtrace stays readable.
          # Must match warm-release-cache.yml or the cached artifacts
          # fingerprint differently and get rebuilt.
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: nix develop --command trunk build --release --public-url /wows-toolkit/tactics/
        working-directory: crates/wt-web

      - name: Check latest stable tag
        id: latest
        run: |
          latest_tag="$(git ls-remote --tags --refs origin 'refs/tags/v*' | cut -f2 | sed 's#refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          if [ -z "$latest_tag" ]; then
            echo "::error::No stable version tag was found."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "$latest_tag" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping stale release $GITHUB_REF_NAME; latest stable tag is $latest_tag."
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble deploy directory
        if: steps.latest.outputs.is_latest == 'true'
        run: |
          mkdir -p _deploy/tactics
          cp -r site/* _deploy/
          if [ ! -f crates/wt-web/dist/index.html ]; then
            echo "::error::The tactics build produced no output in crates/wt-web/dist."
            exit 1
          fi
          cp -r crates/wt-web/dist/* _deploy/tactics/

      - name: Setup Pages
        if: steps.latest.outputs.is_latest == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.latest.outputs.is_latest == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.latest.outputs.is_latest == 'true'
        uses: actions/deploy-pages@v4
