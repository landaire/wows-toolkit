name: Deploy site to GitHub Pages

on:
  # Publish only stable releases. Development and prerelease changes do not
  # update the production site.
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize release deployments.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Expand runner swap
        run: bash scripts/expand-runner-swap.sh 16

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cachix
        uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      - name: Bootstrap Buck2 and the toolchain
        run: ./bootstrap.sh

      - name: Build wt-web WASM app
        run: nix develop --command buck2 build -m release //crates/wt-web:site --out _tactics

      - name: Check latest stable tag
        id: latest
        run: |
          latest_tag="$(git ls-remote --tags --refs origin 'refs/tags/v*' | cut -f2 | sed 's#refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          if [ -z "$latest_tag" ]; then
            echo "::error::No stable version tag was found."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "$latest_tag" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping stale release $GITHUB_REF_NAME; latest stable tag is $latest_tag."
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble deploy directory
        if: steps.latest.outputs.is_latest == 'true'
        run: |
          mkdir -p _deploy/tactics
          cp -r site/* _deploy/
          if [ ! -f _tactics/index.html ]; then
            echo "::error::The tactics build produced no index.html in _tactics."
            exit 1
          fi
          cp -r _tactics/* _deploy/tactics/

      - name: Setup Pages
        if: steps.latest.outputs.is_latest == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.latest.outputs.is_latest == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.latest.outputs.is_latest == 'true'
        uses: actions/deploy-pages@v4
