on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

name: CI

# Cancel superseded runs on PR branches. Main pushes get a unique group per
# run: a shared group would let a newly queued run cancel the pending one,
# so rapid pushes would leave middle commits with no CI verdict and no
# cache save.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('{0}-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job runs with the repo's nix dev shell environment so the rust
# toolchain and all system dependencies (GUI libs, openssl, nasm) are
# identical locally and in CI. The nix store is cached via cachix.
# nix-develop exports the devShell environment into GITHUB_ENV so later
# steps (including rust-cache, which needs rustc on PATH) run inside it
# without re-evaluating the flake per step.
#
# Cargo artifacts are cached with rust-cache, which prunes stale artifacts
# before saving. Each compiling job keeps its own cache key: clippy stores
# check-mode artifacts, test stores codegen artifacts, and cache entries are
# immutable once saved, so a shared key would freeze the test cache at
# whichever job saved first. save-if restricts writes to main; PR-branch
# caches are unreachable from other PRs anyway.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Incremental artifacts only help when a target dir is reused across edits;
  # on ephemeral runners they are dead weight that bloats every cache entry.
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'
      - run: nix develop --command cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'
      # Pinned by sha: this action writes GITHUB_ENV and GITHUB_PATH for the
      # whole job, so a hijacked floating tag could poison every later step.
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
      - name: Show toolchain
        run: |
          which cargo rustc
          rustc -vV
          # GITHUB_ENV entries exported by nix-develop override workflow env;
          # fail loudly if the devShell ever starts exporting RUSTFLAGS.
          test "$RUSTFLAGS" = "-D warnings"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-clippy
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # clippy --all-targets resolves features with dev-deps included; this
      # plain check exercises the no-dev-deps graph that release builds use.
      # Dependency artifacts are shared with the clippy pass, so only
      # workspace crates are rechecked.
      - run: cargo check --workspace --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'
      # Pinned by sha: this action writes GITHUB_ENV and GITHUB_PATH for the
      # whole job, so a hijacked floating tag could poison every later step.
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
      - name: Show toolchain
        run: |
          which cargo rustc
          rustc -vV
          # GITHUB_ENV entries exported by nix-develop override workflow env;
          # fail loudly if the devShell ever starts exporting RUSTFLAGS.
          test "$RUSTFLAGS" = "-D warnings"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-test
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace

  check-wasm:
    name: Check (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'
      # Pinned by sha: this action writes GITHUB_ENV and GITHUB_PATH for the
      # whole job, so a hijacked floating tag could poison every later step.
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
      - name: Show toolchain
        run: |
          which cargo rustc
          rustc -vV
          # GITHUB_ENV entries exported by nix-develop override workflow env;
          # fail loudly if the devShell ever starts exporting RUSTFLAGS.
          test "$RUSTFLAGS" = "-D warnings"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy wt-web for wasm32
        run: cargo clippy -p wt-web --target wasm32-unknown-unknown -- -D warnings
