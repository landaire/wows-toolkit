name: Probe metal toolchain

# Temporary, manual only. Builds just the crate whose build script the macOS
# graph was failing on, so the fixup can be checked in minutes instead of
# waiting for the whole Buck matrix. Delete once the Buck job is green.

on:
  workflow_dispatch:

jobs:
  probe:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      - name: Provision the toolchain and crate sources
        run: nix develop --command nu scripts/refresh-buck-toolchain.nu

      - name: Build the crate whose build script now runs
        run: |
          nix develop --command bash scripts/run-offline.sh \
            buck2 build --target-platforms toolchains//platforms:macos_arm64 \
            root//third-party/rust:gpui-pre-apple-0.3

      - name: Confirm the action graph stays hermetic
        run: |
          nix develop --command bash scripts/run-offline.sh \
            nu scripts/check-buck-hermetic.nu root//third-party/rust:gpui-pre-apple-0.3
