name: Probe metal toolchain

# Temporary, manual only. Validates that the checked-in scene.h compiles
# gpui-pre-apple's shaders with the pinned Metal tools, before the Buck rule
# that will do it is written. Delete once that rule exists.

on:
  workflow_dispatch:

jobs:
  probe:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Report the pinned tools
        run: |
          echo "metal:    $(xcrun --sdk macosx --find metal)"
          echo "metallib: $(xcrun --sdk macosx --find metallib)"
          xcrun --sdk macosx metal --version

      - name: Compile the shaders against the checked-in header
        run: |
          set -euxo pipefail
          tar -xzf third-party/rust/vendor/gpui-pre-apple-0.3.5.crate -C /tmp
          crate=/tmp/gpui-pre-apple-0.3.5
          out=$(mktemp -d)
          cp "$crate/src/shaders.metal" "$out/shaders.metal"
          "$(xcrun --sdk macosx --find metal)" \
            -gline-tables-only -mmacosx-version-min=10.15.7 -MO -c \
            "$out/shaders.metal" \
            -include third-party/rust/fixups/gpui-pre-apple/scene.h \
            -o "$out/shaders.air"
          "$(xcrun --sdk macosx --find metallib)" "$out/shaders.air" -o "$out/shaders.metallib"
          ls -la "$out"
          echo "OUT_DIR=$out" >> "$GITHUB_ENV"

      - name: Compare against the build script's own output
        run: |
          set -euxo pipefail
          cargo build -p gpui-pre-apple 2>&1 | tail -5
          ref=$(find target -path '*gpui-pre-apple*' -name scene.h -print | head -1)
          echo "build script header: $ref"
          diff "$ref" third-party/rust/fixups/gpui-pre-apple/scene.h && echo "HEADER IDENTICAL" || echo "HEADER DIFFERS"
