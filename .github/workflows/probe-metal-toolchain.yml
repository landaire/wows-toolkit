name: Probe metal toolchain

# Temporary, manual only. Runs gpui-pre-apple's real build script under Cargo on
# macOS and compares its cbindgen header against the checked-in one, which is
# what the Buck rule will feed the pinned Metal compiler. Delete once that rule
# is verified.

on:
  workflow_dispatch:

jobs:
  probe:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Report the pinned tools
        run: |
          echo "metal:    $(xcrun --sdk macosx --find metal)"
          echo "metallib: $(xcrun --sdk macosx --find metallib)"
          xcrun --sdk macosx metal --version

      - name: Run the real build script
        run: cargo build -p gpui-pre-apple 2>&1 | tail -5

      - name: Compare the header and report the artifacts
        run: |
          set -euo pipefail
          ref=$(find target -path '*gpui-pre-apple*' -name scene.h -print | head -1)
          lib=$(find target -path '*gpui-pre-apple*' -name shaders.metallib -print | head -1)
          echo "build script header: $ref"
          echo "build script metallib: $lib ($(wc -c < "$lib") bytes)"
          if diff -u "$ref" third-party/rust/fixups/gpui-pre-apple/scene.h > /tmp/hdr.diff; then
            echo "HEADER IDENTICAL"
          else
            echo "HEADER DIFFERS"
            head -60 /tmp/hdr.diff
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gpui-pre-apple-generated
          path: |
            target/**/gpui-pre-apple*/out/scene.h
            target/**/gpui-pre-apple*/out/shaders.metallib
