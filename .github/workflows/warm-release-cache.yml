name: Warm release cache

# The desktop and CLI releases build from the Buck graph now and no longer read
# this cache. What remains is the wasm app, which pages.yml still builds with
# trunk and which benefits from a warm dependency cache on main.
#
# rust-cache stores dependency artifacts only, so the cache goes stale when
# the lockfile or the toolchain moves, not when app code changes. The weekly
# run exists because GitHub evicts caches after 7 days without a read, and
# releases can be further apart than that.
on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "flake.lock"
      - ".github/workflows/warm-release-cache.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Four concurrent release-mode rustc processes on the largest crates exhaust
  # the 16 GB hosted runner and it gets killed with no diagnostic.
  CARGO_BUILD_JOBS: "2"

jobs:
  # Mirrors the Linux Flatpak job in build.yml. The toolchain, target, feature
  # set and env must match it exactly or the restored artifacts fingerprint
  # differently and get rebuilt anyway.
  wasm:
    name: wasm release dependencies
    runs-on: ubuntu-latest
    # Profile settings feed the fingerprint, so this has to match the strip
    # setting pages.yml builds with or nothing here is reusable.
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v4

      - name: Expand runner swap
        run: ./scripts/expand-runner-swap.sh 16G

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      # Pinned by sha: this action writes GITHUB_ENV and GITHUB_PATH for the
      # whole job, so a hijacked floating tag could poison every later step.
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-release
          cache-on-failure: true

      - name: Build wt-web WASM app
        run: nix develop --command trunk build --release --public-url /wows-toolkit/tactics/
        working-directory: crates/wt-web
