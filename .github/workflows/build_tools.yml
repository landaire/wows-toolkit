on:
  push:
    # Glob filters, not regexes: alternation is unsupported, so a pre-release
    # suffix is matched with a trailing *. Kept in step with build.yml so the
    # tools and the app attach to the same release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: write

# The tools come from the same graph as the desktop app. minimap_renderer ships
# once: the second Cargo build here never passed --no-default-features, so the
# _cpu binary it produced was the same build under another name.

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # buck2 canonicalises its project root, so a junction resolves back to
      # the long workspace path and link.exe still hits MAX_PATH. Copy instead.
      - name: Copy the checkout to a short path
        shell: pwsh
        run: |
          # Defender holds freshly written artifacts long enough that buck2's
          # materialiser fails to replace them ("Binary being executed").
          Add-MpPreference -ExclusionPath "C:\w", "C:\bt", "$env:RUNNER_TEMP" -ErrorAction SilentlyContinue
          robocopy $env:GITHUB_WORKSPACE C:\w /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with $LASTEXITCODE" }
          $LASTEXITCODE = 0

      - name: Provision the Buck toolchain
        shell: pwsh
        working-directory: C:\w
        run: ./toolchains/windows/provision-toolchain.ps1 -OfflineRoot "$env:RUNNER_TEMP\bo" -InstallRoot "C:\bt"

      - name: Build the tools
        shell: pwsh
        working-directory: C:\w
        run: |
          $manifest = Get-Content -Raw toolchains/windows/toolchain-manifest.json | ConvertFrom-Json
          $buck2 = Join-Path "C:/bt" $manifest.tools.buck2.path
          $targets = @("//:wowsunpack", "//:wows_data_mgr", "//:replayshark", "//:minimap_renderer")
          $out = & $buck2 build -c native_build.mode=release --target-platforms toolchains//windows:windows_x86_64_msvc --show-output @targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($line in $out) {
            $path = ($line -split " ")[-1]
            if ($path -like "*.exe") { Copy-Item $path artifacts/ }
          }
          Get-ChildItem artifacts | ForEach-Object { $_.IsReadOnly = $false }
          # wows_data_mgr locates its manifest by walking up from the working
          # directory, so it has to sit next to the binaries to be found at all.
          Copy-Item game_versions.toml artifacts/
          $slug = "${{ github.ref_name }}" -replace "/", "-"
          Compress-Archive -Path artifacts/* -DestinationPath "wows_toolkit_tools_${slug}_win64.zip"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wows_toolkit_tools_*_win64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Provision the Buck toolchain
        run: nix develop --command nu scripts/refresh-buck-toolchain.nu

      - name: Build the tools
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          out=$(nix develop --command buck2 build -c native_build.mode=release --show-output \
            //:wowsunpack //:wows_data_mgr //:replayshark //:minimap_renderer)
          echo "$out"
          mkdir -p artifacts
          echo "$out" | awk 'NF > 1 { print $NF }' | while read -r path; do cp "$path" artifacts/; done
          chmod +w artifacts/*
          # Linking through Nix records a store path as the interpreter, and that
          # path exists only on the builder.
          for f in artifacts/*; do
            nix develop --command patchelf --set-interpreter /lib64/ld-linux-x86-64.so.2 --remove-rpath "$f"
          done
          # Staged after patchelf, which only accepts ELF files. wows_data_mgr
          # walks up from the working directory to find this manifest, so it has
          # to sit next to the binaries.
          cp game_versions.toml artifacts/
          slug="${GITHUB_REF_NAME//\//-}"
          zip -j "wows_toolkit_tools_${slug}_linux64.zip" artifacts/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wows_toolkit_tools_*_linux64.zip
