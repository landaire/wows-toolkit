name: Generate media bindings

# Temporary, manual only. gpui-pre-media's build script runs bindgen against the
# macOS SDK located through xcrun, which a hermetic Buck action cannot do, so the
# Buck build needs the output checked in. This produces it on a macOS runner.
# Delete this workflow once the bindings are committed.

on:
  workflow_dispatch:

jobs:
  generate:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build the crate so its build script runs
        run: cargo build -p gpui-pre-media

      - name: Locate the generated bindings
        id: locate
        run: |
          set -euo pipefail
          path=$(find target -path '*gpui-pre-media*' -name bindings.rs -print | head -1)
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "--- $path ($(wc -l < "$path") lines) ---"
          cat "$path"

      - uses: actions/upload-artifact@v4
        with:
          name: gpui-pre-media-bindings
          path: ${{ steps.locate.outputs.path }}
