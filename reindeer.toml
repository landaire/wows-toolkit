manifest_path = "Cargo.toml"
third_party_dir = "third-party/rust"
vendor = "local-registry"
cargo_env = [
    "CARGO_CRATE_NAME",
    "CARGO_MANIFEST_DIR",
    "CARGO_PKG_NAME",
    "CARGO_PKG_VERSION",
    "CARGO_PKG_VERSION_MAJOR",
    "CARGO_PKG_VERSION_MINOR",
    "CARGO_PKG_VERSION_PATCH",
    "CARGO_PKG_VERSION_PRE",
]

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""
generated_file_header = """
# @generated by Reindeer. Do not edit by hand.
# Run scripts/update-buck-deps.sh after changing Cargo.toml or Cargo.lock.
"""

[platform.darwin-aarch64]
target = "aarch64-apple-darwin"

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"

[platform.windows-x86_64]
target = "x86_64-pc-windows-msvc"
