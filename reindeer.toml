manifest_path = "Cargo.toml"
third_party_dir = "third-party/rust"
# Crates are not vendored: Buck downloads each one and checks it against the
# checksum in Cargo.lock, and fetches a git dependency at its locked commit.
vendor = false
cargo_env = [
    "CARGO_CRATE_NAME",
    "CARGO_MANIFEST_DIR",
    "CARGO_PKG_AUTHORS",
    "CARGO_PKG_DESCRIPTION",
    "CARGO_PKG_NAME",
    "CARGO_PKG_REPOSITORY",
    "CARGO_PKG_VERSION",
    "CARGO_PKG_VERSION_MAJOR",
    "CARGO_PKG_VERSION_MINOR",
    "CARGO_PKG_VERSION_PATCH",
    "CARGO_PKG_VERSION_PRE",
]

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("//build-support/buck:third_party_rules.bzl", "buildscript_run", "cargo")
"""
generated_file_header = """
# @generated by Reindeer. Do not edit by hand.
# Run scripts/update-buck-deps.nu after changing Cargo.toml or Cargo.lock.
"""

[platform.macos-arm64]
target = "aarch64-apple-darwin"

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"

[platform.windows-msvc]
target = "x86_64-pc-windows-msvc"

# Only wt-web builds for it. The prelude maps `prelude//os:none` with
# `prelude//cpu:wasm32` to this name.
[platform.wasm32]
target = "wasm32-unknown-unknown"
