[env]
# Make the project-local tools discoverable without forcing contributors to
# fix their system PATH. tools/ holds the DotSlash shims; .tooling/ holds what
# `mise run setup` downloads. Nonexistent entries (e.g. the Windows paths on
# Linux/macOS) are ignored. Active in any shell with `mise activate`, and via
# `mise exec -- <cmd>`.
_.path = ["tools", ".tooling/nasm", "C:/Program Files/NASM"]
# Written by `mise run setup`: the clang and llvm-ar that ring needs to build
# for wasm32. Absent until setup has run, which mise tolerates.
_.file = { path = ".tooling/dev.env", redact = false }

# reindeer is not published to crates.io under that name. It used to be
# reachable only through the Nix devShell, which is what forced Windows
# contributors into WSL. buck2 is not installed here at all: it comes from
# tools/buck2 via DotSlash, pinned to the release the vendored prelude was
# expanded from. See tools/README.md.
[tasks.install-reindeer]
description = "Install the reindeer used to regenerate third-party/rust/BUCK"
# +stable, because rust-toolchain.toml pins 1.92 for this workspace and
# reindeer's own dependencies need a newer rustc. Its repository holds several
# packages with binaries, hence the explicit package name.
run = "cargo +stable install --locked --git https://github.com/facebookincubator/reindeer reindeer"

[tasks.setup]
description = "Download and locate the tools a native build needs (NASM, clang, llvm-ar)."
run = "python scripts/setup.py"

[tasks.fmt]
description = "Runs rustfmt with unstable features"
run = "cargo fmt -- --config unstable_features=true --config imports_granularity=Item --config imports_layout=Vertical"

[tasks.check]
description = "Runs cargo-check against all features and WASM target"
run = [
    "cargo check --all-features",
    "cargo check -p wt-web --target wasm32-unknown-unknown",
]

[tasks.fix]
description = "Runs cargo-fix against all features"
run = "cargo fix --all-features --allow-dirty"
depends_post = ["fmt"]

[tasks.clippy-fix]
description = "Runs cargo-clippy-fix against all features"
run = "cargo clippy --fix --all-features --all-targets --allow-dirty"
depends_post = ["fmt"]

[tasks.lint]
description = "Lints the first-party Rust graph through Buck (clippy and rustfmt)"
run = "nu scripts/lint.nu"

[tasks.fix-all]
description = "Runs clippy fix, lints through Buck, checks the WASM target, then formats"
run = [
    # Buck has no autofix, so this stays on Cargo. --allow-staged because jj
    # has no index of its own and anything in git's aborts the fix.
    "cargo clippy --fix --all-features --all-targets --allow-dirty --allow-staged",
    # The strict pass. `cargo clippy --fix` exits 0 even when non-auto-fixable
    # lints remain, so without this a warning sails through locally and fails
    # CI. Buck resolves features per target, which is what the hand-maintained
    # default-feature crate list here used to approximate: --all-features hides
    # feature-gated dead code, and no single Cargo invocation sees both.
    "nu scripts/lint.nu clippy",
    # Still Cargo: the Buck graph has no wasm32 platform yet, and wt-web has no
    # BUCK file. Needs clang, which `mise run setup` provisions.
    "cargo check -p wt-web --target wasm32-unknown-unknown",
]
depends_post = ["fmt"]

[tasks.bump]
description = "Bump versions for published crates and sync workspace deps (usage: mise run bump -- minor)"
run = [
    "cargo set-version -p wows-core --bump {{arg(name=\"level\", i=0)}}",
    "cargo set-version -p wowsunpack --bump {{arg(name=\"level\", i=0)}}",
    "cargo set-version -p wows_replays --bump {{arg(name=\"level\", i=0)}}",
    "cargo set-version -p wows_minimap_renderer --bump {{arg(name=\"level\", i=0)}}",
    "cargo set-version -p wows-battle-world --bump {{arg(name=\"level\", i=0)}}",
    "cargo set-version -p wows-data-mgr --bump {{arg(name=\"level\", i=0)}}",
    "cargo set-version -p wows-replay-insights --bump {{arg(name=\"level\", i=0)}}",
    "cargo set-version -p wt-translations --bump {{arg(name=\"level\", i=0)}}",
    "cargo upgrade -p wows-core -p wowsunpack -p wows_replays -p wows_minimap_renderer -p wows-battle-world -p wows-data-mgr -p wows-replay-insights -p wt-translations --incompatible allow --pinned allow",
]
